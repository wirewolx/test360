name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-online

      - name: Build
        run: npm run build

      - name: Publish to docs/ on default branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: ${{ github.ref_name }}
          folder: dist
          target-folder: docs
          clean: true
          commit-message: 'chore: deploy GitHub Pages [skip ci]'
